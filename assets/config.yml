        subtitle: "2022 年版义务教育课标全文"
        tag: "Standard"
        quick:
          - name: "人教社"
            url: "https://www.pep.com.cn/xw/zt/rjwy/yjkb2022"
            icon: "fa-solid fa-arrow-up-right-from-square"
            target: "_blank"
          - name: "教育部"
            url: "https://www.gov.cn/zhengce/zhengceku/2022-04/21/content_5686535.htm"
            icon: "fa-solid fa-arrow-up-right-from-square"
            target: "_blank"

      - name: "普通高中课程标准"
