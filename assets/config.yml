---
# ============================================================
# 文件：config.yml
# 页面：主页（#）
# 定位：K12 基础教育 — 课程标准、电子教材、学科名师
# 架构：按学科（语/数/英/物/化/生）分组 + 顶部公共资源
# ============================================================

# ---------- 站点全局配置 ----------
title: "诗往哥导航"                  # 主标题
subtitle: "Learning & Education"    # 副标题
logo: "logo.png"                    # 徽标路径
# icon: "fas fa-skull-crossbones"   # 可选图标（Font Awesome）

header: true                        # 显示页眉
footer: '<p><p>使用 <a href="https://bulma.io/">Bulma</a>, <a href="https://vuejs.org/">Vue.js</a> 和 <a href="https://fontawesome.com/">Font Awesome</a> <span class="has-text-danger">❤️</span> 制作 // 在 <a href="https://github.com/bastienwirtz/homer"><i class="fab fa-github-alt"></i></a> 复刻本项目 </p>'

# ---------- 主题与布局 ----------
theme: default                      # 默认主题
columns: "3"                        # 三列网格布局
defaults:
  layout: list                      # 默认列表视图
stylesheet:                         # 加载 custom.css
  - "assets/custom.css"

# ---------- 欢迎消息 ----------
message:
  style: "is-dark"                  # Bulma 消息样式  https://bulma.io/documentation/components/message/#colors
  title: "👋 欢迎 !"
  content: "当全世界抛弃你时，你身上有上亿个细胞都为你而活。💡 <a>使用顶部导航栏快速切换分类</a>！"

# ---------- 顶部导航栏 ----------
links:
  - name: "主页"
    icon: "fas fa-home"
    url: "#"
  - name: "高等教育"
    icon: "fas fa-graduation-cap"
    url: "#higher-education"
  - name: "职业发展"
    icon: "fas fa-briefcase"
    url: "#career-development"
  - name: "数字工具"
    icon: "fas fa-robot"
    url: "#digital-tools"
  - name: "资源软件"
    icon: "fas fa-tools"
    url: "#resources-software"
  - name: "教师资源"
    icon: "fas fa-chalkboard-user"
    url: "#teacher-education"
  - name: "网站源码"
    icon: "fab fa-github"
    url: "https://github.com/lss53/NavGuide"
    target: "_blank"

# ============================================================
# 服务分组（主页内容）
# ============================================================

